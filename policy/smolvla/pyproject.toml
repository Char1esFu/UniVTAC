[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot"
version = "0.5.1"
description = "LeRobot with SmolVLA visuo-tactile extensions"
readme = { text = "LeRobot package vendored for UniVTAC SmolVLA experiments.", content-type = "text/plain" }
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Hugging Face LeRobot contributors and UniVTAC contributors" }]
dependencies = [
    # Version ranges copied from upstream lerobot's pyproject.toml
    # (policy/smolvla_vision/lerobot); unbounded entries are UniVTAC additions.
    "torch>=2.7,<2.12.0",
    "torchvision>=0.22.0,<0.27.0",
    "torchcodec>=0.3.0,<0.12.0; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "numpy>=2.0.0,<2.3.0",
    "opencv-python>=4.9.0,<4.14.0",
    "pillow>=10.0.0,<13.0.0",
    "einops>=0.8.0,<0.9.0",
    "draccus==0.10.0",
    "huggingface-hub>=1.0.0,<2.0.0",
    "requests>=2.32.0,<3.0.0",
    "gymnasium>=1.1.1,<2.0.0",
    "safetensors>=0.4.3,<1.0.0",
    "packaging>=24.2,<26.0",
    "termcolor>=2.4.0,<4.0.0",
    "tqdm>=4.66.0,<5.0.0",
    "datasets>=4.7.0,<5.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pyarrow>=21.0.0,<30.0.0",
    "av>=15.0.0,<16.0.0",
    "jsonlines>=4.0.0,<5.0.0",
    "transformers>=5.4.0,<5.6.0",
    "num2words>=0.5.14,<0.6.0",
    "scipy>=1.14.0,<2.0.0",
    "matplotlib>=3.10.3,<4.0.0",
    "pyzmq>=26.2.1,<28.0.0",
    "grpcio==1.73.1",
    "protobuf>=6.31.1,<6.32.0",
    "wandb>=0.24.0,<0.25.0",
    "pydantic>=2.0.0,<3.0.0",
    "fsspec",
    "fastapi",
    "uvicorn",
    "h5py",
    "pyyaml",
    "typing-extensions",
    "transforms3d>=0.4.2",
    "httpx[socks]>=0.28.1",
]

[project.optional-dependencies]
dataset = [
    "av",
    "datasets",
    "fsspec",
    "h5py",
    "huggingface-hub",
    "jsonlines",
    "matplotlib",
    "numpy",
    "opencv-python",
    "pandas",
    "pillow",
    "pyarrow",
    "safetensors",
    "torch",
    "torchvision",
    "tqdm",
]
training = [
    "accelerate>=1.10.0,<2.0.0",
    "peft>=0.18.0,<1.0.0",
    "sentencepiece",
]
hardware = [
    "opencv-python",
    "pyserial",
    "pyzmq",
]
evaluation = [
    "gymnasium",
    "imageio",
    "imageio-ffmpeg",
]
dev = [
    "pytest",
    "ruff",
]
all = [
    "accelerate",
    "av",
    "datasets",
    "fsspec",
    "gymnasium",
    "h5py",
    "huggingface-hub",
    "imageio",
    "imageio-ffmpeg",
    "jsonlines",
    "matplotlib",
    "numpy",
    "opencv-python",
    "pandas",
    "peft",
    "pillow",
    "pyarrow",
    "pyserial",
    "pyzmq",
    "safetensors",
    "sentencepiece",
    "torch",
    "torchvision",
    "tqdm",
    "transformers",
    "wandb",
]

[project.urls]
Repository = "https://github.com/huggingface/lerobot"

[project.scripts]
lerobot-augment-dataset-quantile-stats = "lerobot.scripts.augment_dataset_quantile_stats:main"
lerobot-calibrate = "lerobot.scripts.lerobot_calibrate:main"
lerobot-dataset-viz = "lerobot.scripts.lerobot_dataset_viz:main"
lerobot-edit-dataset = "lerobot.scripts.lerobot_edit_dataset:main"
lerobot-eval = "lerobot.scripts.lerobot_eval:main"
lerobot-find-cameras = "lerobot.scripts.lerobot_find_cameras:main"
lerobot-find-joint-limits = "lerobot.scripts.lerobot_find_joint_limits:main"
lerobot-find-port = "lerobot.scripts.lerobot_find_port:main"
lerobot-imgtransform-viz = "lerobot.scripts.lerobot_imgtransform_viz:main"
lerobot-info = "lerobot.scripts.lerobot_info:main"
lerobot-record = "lerobot.scripts.lerobot_record:main"
lerobot-replay = "lerobot.scripts.lerobot_replay:main"
lerobot-rollout = "lerobot.scripts.lerobot_rollout:main"
lerobot-setup-can = "lerobot.scripts.lerobot_setup_can:main"
lerobot-setup-motors = "lerobot.scripts.lerobot_setup_motors:main"
lerobot-teleoperate = "lerobot.scripts.lerobot_teleoperate:main"
lerobot-train = "lerobot.scripts.lerobot_train:main"
lerobot-train-tokenizer = "lerobot.scripts.lerobot_train_tokenizer:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["lerobot*"]

[tool.setuptools.package-data]
lerobot = [
    "datasets/*.md",
    "envs/*.json",
    "templates/*.md",
    "transport/*.proto",
]

[tool.uv.extra-build-dependencies]
lerobot = ["setuptools>=69", "wheel"]

[tool.ruff]
line-length = 120
target-version = "py312"
